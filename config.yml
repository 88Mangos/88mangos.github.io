# =========================================================================== #
# Global Hugo Settings
# =========================================================================== #
baseURL: "https://88mangos.github.io/" 
title: tyler yang
theme: PaperMod # see themes/PaperMod

# =========================================================================== #
# Hugo Core Features
# =========================================================================== #
enableInlineShortcodes: true 
enableRobotsTXT: true

# set number of posts per page 
pagination:
  pagerSize: 20 
# as well as tags folder
taxonomies:
    tag: tags

# =========================================================================== #
# PaperMod Theme Parameters
# =========================================================================== #
params:
    description: "Tyler Yang's Personal Website"
    author: Tyler Yang
    MainSections: ["coursework", "projects"]

    # googleAnalyticsID: "G-XXXXX"

    # ======================================================================= #
    # Appearance
    # ======================================================================= #
    DateFormat: "January 2006"
    hideFooter: true
    disableAnchoredHeadings: true # hide hashtag anchor symbols next to headings
    
    # Dark Mode, no toggle
    defaultTheme: dark
    disableThemeToggle: true
    
    # ======================================================================= #
    # User Quality of Life 
    # ======================================================================= #
    ShowCodeCopyButtons: true
    disableScrollToTop: true 
    math: true # MathJax/KaTeX support

    # ======================================================================= #
    # Post-Related Stuff
    # ======================================================================= #
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowAllPagesInArchive: false
    ShowWordCount: false
    comments: false # no post comments

    
    ShowToc: false            # no table of contents
                              # thus options below are irrelevant
    TocOpen: true 
    UseHugoToc: true
    cover:                    # visibility of post cover images
        hiddenInList: false
        hiddenInSingle: true
    label:                    # adds label to cover images 
      text: "Tyler Yang"  
      icon: favicon.ico
      iconHeight: 18

# =========================================================================== #
# Homepage
# Profile Mode instead of default blog list homepage
# =========================================================================== # 
    profileMode: 
          enabled: true
          title: Tyler Yang
          subtitle: "Studying CS + Computer Systems at CMU School of Computer Science. This website documents my coursework and projects, and serves as a central hub for my academic things. For example, check out '88Mangos' below for LaTeX poster templates and shortcuts I use."
          imageUrl: "picture.png"
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Coursework
              url: coursework/
            - name: Projects
              url: projects/
            - name: 88Mangos 
              url: https://github.com/88Mangos/88Mangos
            # - name: PLACEHOLDER
            #   url: path/to/placeholder/

    socialIcons:
        - name: GitHub
          url: https://github.com/88Mangos
        - name: LinkedIn
          url: https://www.linkedin.com/in/tyler-j-yang/
        # - name: Email
        #   url: mailto:tylery[at]andrew[dot]cmu[dot]edu

    assets:
        disableScrollBarStyle: true
        favicon16x16: "favicon-16x16.png"
        favicon32x32: "favicon-32x32.png"
        appleTouchIcon: "apple-touch-icon.png"


# =========================================================================== #
# Rendering Engine
# =========================================================================== #
markup:
    goldmark:
        renderer:
            unsafe: true

    highlight: # code highlighting 
        guessSyntax: true # auto detect language
        style: autumn 

    tableOfContents: 
        endLevel: 3
        ordered: false
        startLevel: 1